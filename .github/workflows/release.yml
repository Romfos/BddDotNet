name: Release packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nuget package version"
        required: true
        type: string
run-name: Release ${{ inputs.Version }}

jobs:
  release:
    permissions:
      id-token: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build package
        run: dotnet pack -p:VersionPrefix=${{ inputs.Version }} -o ./build ./src/BddDotNet.slnx -p:CI=true

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            build/*.nupkg
            build/*.snupkg
          retention-days: 7

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nupkg
        run: dotnet nuget push .\build\*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json